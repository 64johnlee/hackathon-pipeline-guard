name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.14 matches the Docker runtime (python:3.14-slim); 3.12 guards the floor
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Format check (ruff)
        run: python -m ruff format --check .

      - name: Syntax / import check
        run: python -m compileall -q pipelineguard

      - name: CLI smoke test
        env:
          GITLAB_TOKEN: smoke
          GEMINI_API_KEY: smoke
          SPLUNK_MCP_TOKEN: smoke
          SPLUNK_HEC_TOKEN: smoke
        run: |
          pipelineguard --help
          pipelineguard diagnose --help
          pipelineguard watch --help
          pipelineguard serve --help
          pipelineguard splunk --help
          pipelineguard splunk investigate --help
          pipelineguard splunk ingest --help

      - name: Run tests
        run: pytest --tb=short -q
