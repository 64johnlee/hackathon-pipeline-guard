name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Syntax / import check
        run: python -m compileall -q pipelineguard

      - name: CLI smoke test
        env:
          GITLAB_TOKEN: smoke
          GEMINI_API_KEY: smoke
          SPLUNK_MCP_TOKEN: smoke
          SPLUNK_HEC_TOKEN: smoke
        run: |
          pipelineguard --help
          pipelineguard diagnose --help
          pipelineguard watch --help
          pipelineguard serve --help
          pipelineguard splunk --help
          pipelineguard splunk investigate --help
          pipelineguard splunk ingest --help

      - name: Run tests
        run: pytest --tb=short -q
