[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipelineguard"
version = "0.1.0"
description = "AI-powered GitLab CI pipeline monitoring and auto-fix agent using Gemini"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "google-genai>=0.8.0",
    "mcp>=1.0.0",
    "python-gitlab>=4.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110.0", "uvicorn>=0.29.0", "stripe>=5.0.0"]
vertex = ["google-cloud-aiplatform[reasoningengine]>=1.60.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "pytest-mock>=3.12", "ruff>=0.4.0"]

[project.scripts]
pipelineguard = "pipelineguard.cli:main"
pipelineguard-mcp = "pipelineguard.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["pipelineguard"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
