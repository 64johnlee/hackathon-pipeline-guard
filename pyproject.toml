[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipelineguard"
version = "0.1.0"
description = "AI-powered GitLab CI pipeline monitoring and auto-fix agent using Gemini — UiPath Maestro + Google Cloud integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "google-genai>=1.0.0",
    "mcp>=1.0.0",
    "python-gitlab>=8.4.0",
    "click>=8.4.1",
    "rich>=15.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.1",
    "anyio>=4.13.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.136.3", "uvicorn>=0.49.0", "stripe>=15.2.1"]
vertex = ["google-cloud-aiplatform[reasoningengine]>=1.157.0"]
dev = ["pytest>=9.0.3", "pytest-asyncio>=0.23", "pytest-mock>=3.12", "ruff>=0.4.0"]

[project.scripts]
pipelineguard = "pipelineguard.cli:main"
pipelineguard-mcp = "pipelineguard.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["pipelineguard"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "UP"]
ignore = ["E501", "BLE001", "PLC0415", "INP001", "TRY003", "TRY300", "PYI034", "RUF001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
